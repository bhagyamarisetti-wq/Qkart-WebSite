<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="./Login.css">

<body>

        </p>

        <footer>©2026 Your Company. All rights reserved.</footer>

    </form>

    <script src="./Login.js"></script>

</body>
</html>
